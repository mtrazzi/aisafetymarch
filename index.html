<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Treaty March</title>
<meta name="description" content="March for an AI Treaty. Saturday, Nov 14 in San Francisco and Washington, DC.">
<meta property="og:title" content="AI Treaty March">
<meta property="og:description" content="March for an AI Treaty. Saturday, Nov 14 in San Francisco and Washington, DC.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aitreatymarch.org">
<link rel="canonical" href="https://aitreatymarch.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #111111;
    --paper: #f2eee6;
    --red: #d62828;
    --gray: #6b6b6b;
    --font-display: 'Archivo Black', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  ::selection { background: var(--red); color: var(--paper); }

  body {
    background: var(--paper);
    color: var(--black);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2rem 2rem;
    border-bottom: 3px solid var(--black);
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .wordmark span { color: var(--red); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 5rem 1rem;
  }
  .kicker {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 1.5rem;
  }
  h1 {
    font-family: var(--font-display);
    text-transform: uppercase;
    font-size: clamp(2.6rem, 9.5vw, 8rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
  }
  h1 .line { display: block; }
  h1 .red { color: var(--red); }

  .intro {
    max-width: 640px;
    margin-top: 2rem;
    font-size: 1.15rem;
    line-height: 1.6;
    color: #333;
    text-wrap: balance;
  }
  .intro p + p { margin-top: 0.5rem; }

  .cities {
    margin-top: 3.5rem;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 400px));
    gap: 1.5rem;
    width: 100%;
    justify-content: center;
    align-items: start;
  }
  .city {
    display: block;
    text-decoration: none;
    color: var(--black);
    border: 3px solid var(--black);
    background: var(--paper);
    padding: 2rem 1.5rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .city:hover {
    transform: translate(-3px, -3px);
    box-shadow: 6px 6px 0 var(--black);
  }
  .city .name {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 2.6vw, 2rem);
    white-space: nowrap;
    text-transform: uppercase;
  }
  .city .when {
    margin-top: 0.5rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--red);
  }
  .city .cta {
    display: inline-block;
    margin-top: 1.25rem;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    background: var(--red);
    color: var(--paper);
    padding: 0.8rem 1.4rem;
  }


  @media (max-width: 640px) {
    .topbar { padding: 1rem; }
    .cities { grid-template-columns: 1fr; }
  }

  .city { cursor: default; }
  .city:hover { transform: none; box-shadow: none; }
  .btns { display: flex; gap: 0.6rem; justify-content: center; margin-top: 1.25rem; flex-wrap: wrap; }
  .opt {
    font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem;
    text-transform: uppercase; letter-spacing: 0.08em; text-decoration: none;
    padding: 0.75rem 1.1rem; border: 3px solid var(--black);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .opt:hover { transform: translate(-2px,-2px); box-shadow: 4px 4px 0 var(--black); }
  .opt.partiful { background: var(--red); border-color: var(--red); color: var(--paper); }
  .opt.mobilize { background: var(--paper); color: var(--black); }

  .rsvp { position: relative; display: inline-block; margin-top: 1.25rem; }
  .rsvp > button.cta { border: 0; cursor: pointer; margin-top: 0; }
  .rsvp .menu {
    display: none; position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%);
    background: var(--paper); border: 3px solid var(--black); box-shadow: 6px 6px 0 var(--black);
    min-width: 220px; z-index: 10; text-align: left;
  }
  .rsvp.open .menu { display: block; }
  .rsvp .menu a {
    display: block; padding: 0.85rem 1rem; text-decoration: none; color: var(--black);
    font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .rsvp .menu a + a { border-top: 2px solid var(--black); }
  .rsvp .menu a:hover { background: var(--red); color: var(--paper); }
</style>
</head>
<body>
  <header class="topbar">
    <div class="wordmark">AI Treaty <span>March</span></div>
  </header>

  <main>
    <div class="kicker">Saturday, Nov 14</div>
    <h1>
      <span class="line">March for</span>
      <span class="line red">an AI Treaty</span>
    </h1>

    <div class="intro">
      <p>On Nov 18, Trump meets Xi Jinping in China.</p>
      <p>It's time they make a deal to stop the AI arms race.</p>
    </div>

    <div class="cities">
      <div class="city">
        <div class="name">San Francisco</div>
        <div class="when">Sat, Nov 14 &middot; 12 PM &rarr; 3 PM</div>
        <div class="rsvp">
          <button class="cta" type="button">RSVP &darr;</button>
          <div class="menu">
            <a href="https://partiful.com/e/IKicFMI9yxmA0qZOJN0E" target="_blank" rel="noopener">Partiful &rarr;</a>
            <a href="https://www.mobilize.us/stoptheairace/event/1059616/" target="_blank" rel="noopener">Mobilize &rarr;</a>
          </div>
        </div>
      </div>
      <div class="city">
        <div class="name">Washington, DC</div>
        <div class="when">Sat, Nov 14 &middot; 11 AM &rarr; 1 PM</div>
        <div class="rsvp">
          <button class="cta" type="button">RSVP &darr;</button>
          <div class="menu">
            <a href="https://luma.com/2j6hkk6a" target="_blank" rel="noopener">Luma &rarr;</a>
            <a href="https://partiful.com/e/WMRLtTLXNxQeircVi4Cv" target="_blank" rel="noopener">Partiful &rarr;</a>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
document.querySelectorAll('.rsvp > button').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  const r = b.parentElement, was = r.classList.contains('open');
  document.querySelectorAll('.rsvp.open').forEach(x => x.classList.remove('open'));
  if (!was) r.classList.add('open');
}));
document.addEventListener('click', () => document.querySelectorAll('.rsvp.open').forEach(x => x.classList.remove('open')));
</script>
</body>
</html>
